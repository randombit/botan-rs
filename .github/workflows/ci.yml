name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  rustfmt:
    runs-on: ubuntu-26.04

    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - uses: actions/checkout@v4

      - run: cargo fmt -- --check
  clippy:
    runs-on: ubuntu-26.04

    steps:
      - run: sudo apt-get -qq install libbotan-3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - uses: actions/checkout@v4

      - run: ./botan-src/scripts/fetch.py
      - run: cargo +nightly clippy --all-targets -- --deny warnings
      - run: cargo +nightly clippy --all-targets --features dynamic-loading -- --deny warnings
  ci:
    runs-on: ${{ matrix.os }}

    env:
        RUST_BACKTRACE: 1

    strategy:
      fail-fast: false

      # Builds that use the system Botan (no git/vendored feature) test
      # whichever Botan the distribution provides: Ubuntu 24.04 is the last
      # release shipping Botan 2 (2.19), while Ubuntu 26.04 ships Botan 3
      # (3.10), so such builds are run on both. Everything else runs on
      # Ubuntu 26.04.
      matrix:
        include:
          - toolchain: stable
            os: ubuntu-24.04
          - toolchain: stable
            os: ubuntu-26.04
          - toolchain: stable
            features: no-std+git
            os: ubuntu-26.04
          - toolchain: stable
            features: git
            os: ubuntu-26.04
          - toolchain: stable
            features: git+minimized
            os: ubuntu-26.04
          - toolchain: stable
            features: vendored
            os: ubuntu-26.04
          - toolchain: stable
            features: dynamic
            os: ubuntu-24.04
          - toolchain: stable
            features: dynamic
            os: ubuntu-26.04
          - toolchain: stable
            features: dynamic+git
            os: ubuntu-26.04
          - toolchain: 1.85.1 # MSRV no-std
            features: no-std+git
            os: ubuntu-26.04
          - toolchain: 1.85.1 # MSRV
            os: ubuntu-24.04
          - toolchain: 1.85.1 # MSRV dynamic loading
            features: dynamic
            os: ubuntu-24.04
          - toolchain: nightly
            os: ubuntu-24.04
          - toolchain: nightly
            features: no-std+git
            os: ubuntu-26.04

    steps:
      - run: sudo apt-get -qq install ccache
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
            path: |
              ~/.cache/ccache
            key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.features }}-${{ github.run_id }}
            restore-keys: |
               ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.features }}
      - uses: dtolnay/rust-toolchain@master
        with:
          target: ${{ matrix.target }}
          toolchain: ${{ matrix.toolchain }}
      - run: ./.ci/build.py ${{ matrix.toolchain }} ${{ matrix.features }}

  ci_arm:
    runs-on: ${{ matrix.os }}

    env:
        RUST_BACKTRACE: 1

    strategy:
      fail-fast: false

      # See the comment on the ci job regarding the OS selection
      matrix:
        include:
          - toolchain: stable
            os: ubuntu-24.04-arm
          - toolchain: stable
            os: ubuntu-26.04-arm
          - toolchain: stable
            features: git
            os: ubuntu-26.04-arm
          - toolchain: stable
            features: dynamic
            os: ubuntu-24.04-arm
          - toolchain: nightly
            os: ubuntu-24.04-arm

    steps:
      - run: sudo apt-get -qq install ccache
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
            path: |
              ~/.cache/ccache
            key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.features }}-${{ github.run_id }}
            restore-keys: |
               ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.features }}
      - uses: dtolnay/rust-toolchain@master
        with:
          target: ${{ matrix.target }}
          toolchain: ${{ matrix.toolchain }}
      - run: ./.ci/build.py ${{ matrix.toolchain }} ${{ matrix.features }}

  ci_mac:
    runs-on: macos-15

    env:
        RUST_BACKTRACE: 1

    strategy:
      fail-fast: false

      matrix:
        include:
          - toolchain: stable
          - toolchain: stable
            features: vendored
          - toolchain: stable
            features: dynamic
          - toolchain: nightly

    steps:
      - run: brew install ccache
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
            path: |
              /Users/runner/Library/Caches/ccache
            key: mac-${{ matrix.toolchain }}-${{ matrix.features }}-${{ github.run_id }}
            restore-keys: |
               mac-${{ matrix.toolchain }}-${{ matrix.features }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: ./.ci/build.py ${{ matrix.toolchain }} ${{ matrix.features }}

  ci_windows:
    runs-on: windows-2025

    env:
        RUST_BACKTRACE: 1

    strategy:
      fail-fast: false

      matrix:
        include:
          - toolchain: stable
            features: vendored
#          - toolchain: nightly

    steps:
      - run: choco install -y sccache
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
            path: |
               C:/Users/runneradmin/AppData/Local/Mozilla/sccache/cache
            key: windows-${{ matrix.toolchain }}-${{ matrix.features }}-${{ github.run_id }}
            restore-keys: |
               windows-${{ matrix.toolchain }}-${{ matrix.features }}
      - uses: egor-tensin/vs-shell@v2
        with:
          arch: amd64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: python3 ./.ci/build.py ${{ matrix.toolchain }} ${{ matrix.features }} --compiler-cache=sccache
